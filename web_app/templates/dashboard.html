<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Pedestrian Navigation</title>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1976D2;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .stat-info h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: normal;
        }
        
        .stat-info p {
            color: #333;
            font-size: 32px;
            font-weight: bold;
        }
        
        .stat-icon {
            font-size: 48px;
            opacity: 0.2;
        }
        
        .stat-card.danger .stat-icon {
            color: #f44336;
        }
        
        .stat-card.danger .stat-info p {
            color: #f44336;
        }
        
        .stat-card.warning .stat-icon {
            color: #ff9800;
        }
        
        .stat-card.warning .stat-info p {
            color: #ff9800;
        }
        
        .stat-card.success .stat-icon {
            color: #4CAF50;
        }
        
        .stat-card.success .stat-info p {
            color: #4CAF50;
        }
        
        .stat-card.info .stat-icon {
            color: #2196F3;
        }
        
        .stat-card.info .stat-info p {
            color: #2196F3;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .chart-card h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .recent-obstacles {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .recent-obstacles h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .obstacle-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .obstacle-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .obstacle-item:last-child {
            border-bottom: none;
        }
        
        .obstacle-info {
            flex: 1;
        }
        
        .obstacle-info h4 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .obstacle-info p {
            color: #666;
            font-size: 13px;
        }
        
        .obstacle-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-critical {
            background: #ffebee;
            color: #c62828;
        }
        
        .badge-high {
            background: #fff3e0;
            color: #e65100;
        }
        
        .badge-medium {
            background: #fff9c4;
            color: #f57f17;
        }
        
        .badge-low {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> Analytics Dashboard</h1>
        <a href="/" class="btn btn-primary">
            <i class="fas fa-map"></i> Back to Map
        </a>
    </div>
    
    <!-- Statistics Cards -->
    <div class="stats-grid">
        <div class="stat-card danger">
            <div class="stat-info">
                <h3>Total Obstacles</h3>
                <p id="total-obstacles">-</p>
            </div>
            <i class="fas fa-exclamation-triangle stat-icon"></i>
        </div>
        
        <div class="stat-card warning">
            <div class="stat-info">
                <h3>Potholes</h3>
                <p id="pothole-count">-</p>
            </div>
            <i class="fas fa-circle stat-icon"></i>
        </div>
        
        <div class="stat-card warning">
            <div class="stat-info">
                <h3>Cracks</h3>
                <p id="crack-count">-</p>
            </div>
            <i class="fas fa-bolt stat-icon"></i>
        </div>
        
        <div class="stat-card success">
            <div class="stat-info">
                <h3>Active Users</h3>
                <p id="active-users">-</p>
            </div>
            <i class="fas fa-users stat-icon"></i>
        </div>
    </div>
    
    <!-- Charts -->
    <div class="charts-grid">
        <div class="chart-card">
            <h2><i class="fas fa-chart-pie"></i> Obstacles by Type</h2>
            <div class="chart-container">
                <canvas id="typeChart"></canvas>
            </div>
        </div>
        
        <div class="chart-card">
            <h2><i class="fas fa-chart-bar"></i> Severity Distribution</h2>
            <div class="chart-container">
                <canvas id="severityChart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- Recent Obstacles -->
    <div class="recent-obstacles">
        <h2><i class="fas fa-clock"></i> Recent Detections</h2>
        <div id="obstacle-list" class="obstacle-list">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>
        </div>
    </div>
    
    <script>
        let typeChart, severityChart;
        
        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                if (data.success) {
                    // Update stat cards
                    document.getElementById('total-obstacles').textContent = data.total_obstacles;
                    document.getElementById('pothole-count').textContent = data.by_type.pothole || 0;
                    document.getElementById('crack-count').textContent = data.by_type.crack || 0;
                    document.getElementById('active-users').textContent = data.active_users;
                    
                    // Update charts
                    updateTypeChart(data.by_type);
                    updateSeverityChart(data.by_severity);
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load recent obstacles
        async function loadRecentObstacles() {
            try {
                const response = await fetch('/api/obstacles');
                const data = await response.json();
                
                if (data.success) {
                    const listEl = document.getElementById('obstacle-list');
                    
                    if (data.obstacles.length === 0) {
                        listEl.innerHTML = '<div class="loading"><p>No obstacles detected yet</p></div>';
                        return;
                    }
                    
                    // Sort by timestamp (newest first)
                    const sorted = data.obstacles.sort((a, b) => 
                        new Date(b.timestamp) - new Date(a.timestamp)
                    );
                    
                    // Display latest 20
                    listEl.innerHTML = sorted.slice(0, 20).map(obs => `
                        <div class="obstacle-item">
                            <div class="obstacle-info">
                                <h4>${obs.type}</h4>
                                <p>
                                    ${obs.latitude.toFixed(6)}, ${obs.longitude.toFixed(6)} • 
                                    ${new Date(obs.timestamp).toLocaleString()} • 
                                    Confidence: ${(obs.confidence * 100).toFixed(1)}%
                                </p>
                            </div>
                            <span class="obstacle-badge badge-${obs.severity}">
                                ${obs.severity.toUpperCase()}
                            </span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading obstacles:', error);
            }
        }
        
        // Update type chart
        function updateTypeChart(typeData) {
            const ctx = document.getElementById('typeChart').getContext('2d');
            
            if (typeChart) {
                typeChart.destroy();
            }
            
            const labels = Object.keys(typeData);
            const values = Object.values(typeData);
            const colors = [
                '#f44336', '#ff9800', '#2196F3', '#9c27b0', 
                '#4CAF50', '#00bcd4', '#ffeb3b', '#795548'
            ];
            
            typeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors.slice(0, labels.length),
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        // Update severity chart
        function updateSeverityChart(severityData) {
            const ctx = document.getElementById('severityChart').getContext('2d');
            
            if (severityChart) {
                severityChart.destroy();
            }
            
            severityChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Low', 'Medium', 'High', 'Critical'],
                    datasets: [{
                        label: 'Number of Obstacles',
                        data: [
                            severityData.low || 0,
                            severityData.medium || 0,
                            severityData.high || 0,
                            severityData.critical || 0
                        ],
                        backgroundColor: [
                            '#4CAF50',
                            '#ffeb3b',
                            '#ff9800',
                            '#f44336'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
        
        // Initialize
        window.onload = function() {
            loadStats();
            loadRecentObstacles();
            
            // Refresh every 10 seconds
            setInterval(() => {
                loadStats();
                loadRecentObstacles();
            }, 10000);
        };
    </script>
</body>
</html>
